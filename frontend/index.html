<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>



    <nav class="navbar bg-black">
        <div class="container-fluid">

            <span class="navbar-brand mb-0 h1 text-white ms-5">
                Expense Tracker
            </span>

            <button id="darkModeButton" class="btn btn-outline-primary me-3">
                <i class="bi bi-moon-stars-fill"></i>
            </button>

        </div>
    </nav>


    <div class="container my-4">

        <div class="summary-grid">

            <div class="card text-center" style="height: 140px;">
                <div class="card-body">
                    <h6>Total</h6>
                    <h2 id="totalAmount">0.00</h2>
                </div>
            </div>


            <div class="card text-center" style="height: 140px;">
                <div class="card-body">
                    <h6>Number of expenses</h6>
                    <h2 id="expenseCount">0</h2>
                </div>
            </div>


            <div class="card text-center" style="height: 140px;">
                <div class="card-body">
                    <h6>Highest expense</h6>

                    <h2 id="highestAmount">0.00</h2>

                    <p id="highestTitle" class="mb-0 text-muted text-truncate">
                    </p>
                </div>
            </div>
            
        </div>
    </div>

    <div class="container my-4">

        <div class="card">
            <div class="card-body">

                <h4 class="card-title mb-4">Add expense</h4>

                <form id="expenseForm">

                    <div class="row g-3">

                        <div class="col-12 col-md-4">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" id="title" class="form-control">

                        </div>

                        <div class="col-12 col-md-2">
                            <label for="amount" class="form-label">Amount</label>
                            <input type="number" id="amount" class="form-control">


                        </div>


                        <div class="col-12 col-md-3">
                            <label for="category" class="form-label">Category</label>
                            <select id="category" class="form-select ">
                                <option value="" selected disabled>Choose category</option>
                                <option value="Food">Food</option>
                                <option value="Transport">Transport</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Bills">Bills</option>
                                <option value="Other">Other</option>
                            </select>

                        </div>

                        <div class="col-12 col-md-3">
                            <label for="date" class="form-label">Date</label>
                            <input type="date" id="date" class="form-control">
                        </div>

                        <div class="col-12">
                            <button type="submit" class="btn btn-primary mt-2">
                                Add expense
                            </button>
                        </div>

                    </div>

                </form>

            </div>
        </div>

    </div>
    <div class="container mt-3">
    <div id="alertMessage" class="alert alert-danger d-none" role="alert">
    </div>
</div>
    <div class="container my-4">

        <div class="card">
            <div class="card-body">

                <!-- Header -->
                <div class="row g-3 align-items-center mb-4">

                    <div class="col-12 col-md-auto">
                        <h4 class="mb-0">Expenses</h4>
                    </div>

                    <div class="col-12 col-md-auto ms-md-auto">
                        <div class="d-md-flex align-items-md-center gap-md-2">
                            <label for="searchTitle" class="form-label mb-md-0">
                                Search
                            </label>
                            <input type="text" id="searchTitle" class="form-control" placeholder="Title">
                        </div>
                    </div>

                    <div class="col-12 col-md-auto">
                        <div class="d-md-flex align-items-md-center gap-md-2">
                            <label for="filterCategory" class="form-label mb-md-0">
                                Category
                            </label>
                            <select id="filterCategory" class="form-select">
                                <option value="">All</option>
                                <option value="Food">Food</option>
                                <option value="Transport">Transport</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Bills">Bills</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>


                    </div>


                </div>
                <div id="loadingSpinner" class="text-center d-none my-3">
                    <div class="spinner-border" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
                <!-- Table -->
                <div class="table-responsive">

                    <table class="table table-sm w-100">

                        <thead>
                            <tr>
                                <th style="width: 22%;">Title</th>
                                <th style="width: 12%;">Amount</th>
                                <th style="width: 18%;">Category</th>
                                <th style="width: 23%;">Date</th>
                                <th style="width: 25%;">Actions</th>
                            </tr>
                        </thead>

                        <tbody id="expensesTableBody">

                        </tbody>

                    </table>

                </div>

            </div>
        </div>

    </div>
    <div class="modal fade" id="editExpenseModal" tabindex="-1">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Edit Expense
                    </h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <form id="editExpenseForm">
                        <div id="editAlertMessage" class="alert alert-danger d-none" role="alert"></div>

                        <input type="hidden" id="editId">

                        <div class="mb-3">
                            <label for="editTitle" class="form-label">
                                Title
                            </label>

                            <input type="text" id="editTitle" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label for="editAmount" class="form-label">
                                Amount
                            </label>

                            <input type="number" id="editAmount" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label for="editCategory" class="form-label">
                                Category
                            </label>

                            <select id="editCategory" class="form-select">
                                <option value="Food">Food</option>
                                <option value="Transport">Transport</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Bills">Bills</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="editDate" class="form-label">
                                Date
                            </label>

                            <input type="date" id="editDate" class="form-control">
                        </div>

                    </form>

                </div>

                <div class="modal-footer">

                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="closeEditModal">

                        Cancel
                    </button>

                    <button type="submit" form="editExpenseForm" class="btn btn-primary">
                        Save changes
                    </button>

                </div>

            </div>

        </div>

    </div>

    
<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteExpenseModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Confirm Delete</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close">
        </button>
      </div>

      <div class="modal-body">
        Are you sure you want to delete this expense?

        <p class="fw-bold mt-2 mb-0" id="deleteExpenseTitle"></p>
      </div>

      <div class="modal-footer">
        <button
          type="button"
          class="btn btn-secondary"
          data-bs-dismiss="modal">
          Cancel
        </button>

        <button
          type="button"
          class="btn btn-danger"
          id="confirmDeleteButton">
          Delete
        </button>
      </div>

    </div>
  </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
